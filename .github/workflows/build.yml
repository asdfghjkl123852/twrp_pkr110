name: Build TWRP for OnePlus Ace 5 Pro (PKR110)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'TWRP manifest 分支'
        required: false
        default: 'twrp-14'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # runner 根分区只有 ~72 GB，AOSP 16 源码就要 80 GB，必须先腾空间
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # soong_build 解析全树 Android.bp 峰值 10~12 GB，16 GB runner 需要 swap 兜底
      - name: 创建 swap
        run: |
          # runner 自带一个正在使用的 /swapfile，直接 fallocate 会报 Text file busy
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 openjdk-21-jdk-headless
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 配置 git
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global http.postBuffer 524288000

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: repo init + sync
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 -u https://github.com/kmiit/platform_manifest_twrp_aosp \
                    -b "${{ github.event.inputs.branch || 'twrp-14' }}" --no-clone-bundle
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
          df -h /

      - name: 拉取 PKR110 设备树
        run: |
          cd ~/twrp
          git clone --depth=1 -b twrp-14 https://github.com/kmiit/android_device_oneplus_hummer-TWRP \
                    device/OnePlus/PKR110
          # 只构建 64 位变体：AOSP 默认会启用 TARGET_2ND_ARCH=arm 让模块图翻倍
          grep -q TARGET_SUPPORTS_32_BIT_APPS device/OnePlus/PKR110/BoardConfig.mk || \
            printf '\nTARGET_SUPPORTS_32_BIT_APPS := false\nTARGET_SUPPORTS_64_BIT_APPS := true\n' \
              >> device/OnePlus/PKR110/BoardConfig.mk

      - name: 编译 recovery
        run: |
          cd ~/twrp
          # out 放到 /mnt（~74 GB 独立分区），否则根分区装不下源码 + 产物
          # /mnt 属 root，不先建目录并改属主，m 启动即报 Permission denied
          sudo mkdir -p /mnt/out && sudo chown -R "$USER" /mnt/out
          export OUT_DIR=/mnt/out
          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export USE_CCACHE=1
          export CCACHE_EXEC=$(command -v ccache)
          ccache -M 30G || true
          source build/envsetup.sh
          lunch twrp_PKR110-ap2a-eng
          mka recoveryimage -j$(nproc)
          ls -lh /mnt/out/target/product/PKR110/recovery.img

      # upload-artifact 不会展开 ~ 和 $HOME，必须写绝对路径
      - name: 上传 recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: recovery-PKR110
          path: /mnt/out/target/product/PKR110/recovery.img
          if-no-files-found: error
          retention-days: 15

      - name: 失败时收集日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /mnt/out/error.log
            /mnt/out/verbose.log.gz
            /mnt/out/target/product/PKR110/*.txt
          if-no-files-found: ignore
          retention-days: 7
