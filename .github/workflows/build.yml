name: Build TWRP · OnePlus Ace 5 Pro (PKR110)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'TWRP manifest branch'
        required: false
        default: 'twrp-14'
  push:
    branches: [main]

permissions:
  contents: read

# 同一分支只保留最新一次运行，避免重复 push 触发并发构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MANIFEST: https://github.com/kmiit/platform_manifest_twrp_aosp
  DEVICE_TREE: https://github.com/kmiit/android_device_oneplus_hummer-TWRP
  BRANCH: ${{ inputs.branch || 'twrp-14' }}
  OUT_DIR: /mnt/out

jobs:
  build:
    name: recovery.img
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          swap-storage: false

      - name: Set up toolchain
        run: |
          # soong_build 解析全树峰值 10~12 GB，16 GB runner 需 swap 兜底
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=none
          sudo chmod 600 /swapfile && sudo mkswap -q /swapfile && sudo swapon /swapfile

          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison build-essential curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 openjdk-21-jdk-headless

          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

          git config --global user.name  "ci"
          git config --global user.email "ci@localhost"
          git config --global http.postBuffer 524288000

      - name: Sync source
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 -u "$MANIFEST" -b "$BRANCH" --no-clone-bundle
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

          # 设备树仓库只有 twrp-14 分支
          git clone --depth=1 -b twrp-14 "$DEVICE_TREE" device/OnePlus/PKR110

          # 只构建 64 位变体，否则 AOSP 会补 TARGET_2ND_ARCH=arm 让模块图翻倍
          grep -q TARGET_SUPPORTS_32_BIT_APPS device/OnePlus/PKR110/BoardConfig.mk || \
            printf '\nTARGET_SUPPORTS_32_BIT_APPS := false\nTARGET_SUPPORTS_64_BIT_APPS := true\n' \
              >> device/OnePlus/PKR110/BoardConfig.mk

      - name: Build recovery
        run: |
          cd ~/twrp
          # out 放独立分区，根分区装不下源码 + 产物
          sudo mkdir -p "$OUT_DIR" && sudo chown -R "$USER" "$OUT_DIR"

          export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh
          lunch twrp_PKR110-ap2a-eng
          m recoveryimage -j"$(nproc)"

          ls -lh "$OUT_DIR/target/product/PKR110/recovery.img"

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-PKR110
          path: /mnt/out/target/product/PKR110/recovery.img
          if-no-files-found: error
          retention-days: 15

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /mnt/out/error.log
            /mnt/out/verbose.log.gz
            /mnt/out/target/product/PKR110/*.txt
          if-no-files-found: ignore
          retention-days: 7
